# mcp suite — the local stdio MCP server (@devdigest/mcp).
# A thin HTTP client over the DevDigest REST API, exposing five tools.
# Tests are hermetic units + an in-process/stdio smoke test. Uses npm
# (package-lock.json).
#
# Branch B (S0): mcp/ has no tsconfig `@devdigest/shared` alias — it uses
# hand-rolled local interfaces in mcp/src/api/types.ts instead. So, unlike
# reviewer-core.yml, the vendored shared contracts directory is deliberately
# NOT in the path filter below: a contract change cannot affect mcp/'s
# typecheck.
name: mcp

on:
  push:
    branches: [main]
    paths:
      - 'mcp/**'
      - '.github/workflows/mcp.yml'
  pull_request:
    paths:
      - 'mcp/**'
      - '.github/workflows/mcp.yml'

permissions:
  contents: read

concurrency:
  group: mcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm test
