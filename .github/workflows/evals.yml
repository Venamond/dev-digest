# Harness evals — skills, subagents, workflow-level behavior.
#
# Change-scoped: `detect` maps the PR's changed files onto the eval suites that should run
# (evals/scripts/ci-detect.mjs — see its header for the exact rules) and runs ONLY those, not the
# whole suite. A changed skill/agent with no evals written for it is not a failure: it lands in
# `skipped_*` and gets a visible "SKIP <name> (no evals)" line in the detect job's log and step
# summary, instead of either failing or silently running nothing.
#
# Backend: OpenRouter, not the Claude Code subscription (CI has no interactive login) — see
# evals/README.md "Runners: Claude Code vs OpenRouter". Models, chosen per tier:
#   - eval-skills: actor stays cheap (default deepseek/deepseek-chat) — the content tier never
#     dispatches a subagent, so DeepSeek's documented dispatch weakness doesn't apply, and its
#     content on this tier was independently verified correct (evals/INSIGHTS.md, 2026-08-28).
#     The JUDGE is `anthropic/claude-haiku-4.5`, not the same cheap model — a same-model judge was
#     found non-deterministic on identical input, sometimes dropping items outright (see
#     evals/INSIGHTS.md's Recurring Errors entry); evals/README.md's own design principle already
#     calls for a stronger judge family, for the same reason.
#   - eval-agents / eval-workflow: BOTH actor and judge are `anthropic/claude-haiku-4.5`.
#     `EVAL_MODEL` defaults to exactly this model everywhere else this package runs (see
#     evals/src/config.ts) — CI was the one place still overriding it to a cheaper, dispatch-weak
#     model. These two tiers need reliable subagent dispatch and precise multi-step
#     instruction-following (e.g. citing an exact rule identifier per finding), which is what this
#     default was calibrated for.
#   - Because these are `anthropic/*` OpenRouter slugs, they're served natively by OpenRouter's own
#     Anthropic-wire "Skin" — no LiteLLM translating proxy needed (that was only required for
#     non-Anthropic slugs; see evals/README.md "Running tool tiers on cheap models"). Dropping the
#     proxy from these two jobs also removes its startup/health-check surface, including an
#     unexplained stray `claude-sonnet-5` request logged there once (evals/INSIGHTS.md, Open
#     Questions) — that entire code path is gone now.
#   - eval-workflow keeps `continue-on-error: true`: even the intended model still has documented,
#     non-deterministic flakiness on some cases (doc routing landing on a sibling file — see
#     evals/INSIGHTS.md), so it stays informational, never a merge gate, regardless of model.
# Override any model without touching this file: repo Settings → Actions → Variables →
# EVAL_MODEL / EVAL_JUDGE_MODEL / EVAL_WORKFLOW_MODEL. The API key is a Secret, not a Variable.
name: harness evals

on:
  pull_request:
    paths:
      - '.claude/skills/**'
      - '.claude/agents/**'
      - 'CLAUDE.md'
      - '**/AGENTS.md'
      - 'evals/**'

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

# OPENROUTER_BASE_URL is deliberately never set at workflow level, and no job below points it at a
# local proxy anymore: every model in this file is an anthropic/* slug, served natively by
# OpenRouter's own Anthropic Skin (tool tiers) or its direct OpenAI-format endpoint (content tier)
# at OpenRouter's real base URL. A prior version of eval-skills broke this way once already by
# inheriting a proxy URL meant for a different tier — see the fix commit and evals/INSIGHTS.md.
env:
  EVAL_BACKEND: openrouter
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

jobs:
  # ---------------------------------------------------------------------------------------------
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skills: ${{ steps.d.outputs.skills }}
      agents: ${{ steps.d.outputs.agents }}
      run_workflow: ${{ steps.d.outputs.run_workflow }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: ci-detect.mjs diffs against merge-base, not just HEAD~1

      - id: d
        run: |
          CHANGED_FILES="$(git diff --name-only "$(git merge-base origin/${{ github.base_ref }} HEAD)" HEAD)" \
            node evals/scripts/ci-detect.mjs

      # ci-detect.mjs already logs SKIP lines to the step log (stderr); mirror them into the job
      # summary too so a skipped artifact is visible without opening this step's raw log.
      - if: steps.d.outputs.skipped_skills != '' || steps.d.outputs.skipped_agents != ''
        run: |
          {
            echo "### Evals skipped (no evals written yet)"
            [ -n "${{ steps.d.outputs.skipped_skills }}" ] && echo "- skills: ${{ steps.d.outputs.skipped_skills }}"
            [ -n "${{ steps.d.outputs.skipped_agents }}" ] && echo "- agents: ${{ steps.d.outputs.skipped_agents }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------------------------
  # Static gate, no model, no network: SKILL.md structure/frontmatter/links (evals/src/skill-quality.ts).
  # Runs unconditionally rather than being scoped by `detect` — it's sub-second, so it checks every
  # skill regardless of which one this PR touched (catches drift in an untouched skill too). This
  # is the one tier with zero model variance, so it's the one that actually blocks a merge on its
  # own judgment rather than a threshold. See evals/README.md "Three tiers".
  eval-quality:
    # No `needs: detect` — it doesn't read any of detect's outputs and runs unconditionally
    # (see the comment above), so there's nothing to gate on; it runs in parallel with detect.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: evals
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm eval:quality

  # ---------------------------------------------------------------------------------------------
  eval-skills:
    needs: detect
    if: needs.detect.outputs.skills != '[]'
    strategy:
      fail-fast: false
      max-parallel: 4 # cap simultaneous model calls against the actor/judge API — a concurrency
      # limit distinct from the workflow-level cancel-in-progress group above, which only bounds
      # in-flight *runs* of this whole workflow, not in-flight matrix entries within one run.
      matrix:
        skill: ${{ fromJson(needs.detect.outputs.skills) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: evals
    env:
      EVAL_MODEL: ${{ vars.EVAL_MODEL || 'deepseek/deepseek-chat' }}
      EVAL_JUDGE_MODEL: ${{ vars.EVAL_JUDGE_MODEL || 'anthropic/claude-haiku-4.5' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Content tier (skillTask): a direct OpenAI-format call, no Claude Agent SDK involved — no
      # proxy needed for any model, Anthropic or not. See evals/README.md "Runners" table.
      - run: pnpm vitest run "skills/${{ matrix.skill }}"

      # Report (this run only, no cross-run baseline — see the script's header) + the token half
      # of the CI budget; the time half is this job's timeout-minutes above.
      - if: always()
        run: node scripts/ci-report.mjs
        env:
          CI_REPORT_LABEL: eval-skills / ${{ matrix.skill }}
          EVAL_TOKEN_BUDGET: ${{ vars.EVAL_TOKEN_BUDGET_SKILLS || 200000 }}

  # ---------------------------------------------------------------------------------------------
  eval-agents:
    needs: detect
    if: needs.detect.outputs.agents != '[]'
    strategy:
      fail-fast: false
      max-parallel: 4 # see eval-skills — same reasoning, own cap per job
      matrix:
        agent: ${{ fromJson(needs.detect.outputs.agents) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: evals
    env:
      EVAL_MODEL: ${{ vars.EVAL_MODEL || 'anthropic/claude-haiku-4.5' }}
      EVAL_JUDGE_MODEL: ${{ vars.EVAL_JUDGE_MODEL || 'anthropic/claude-haiku-4.5' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Tool tier (agentTask → Claude Agent SDK) on an anthropic/* slug: OpenRouter's Anthropic
      # Skin serves this natively — no LiteLLM proxy step needed (contrast the old DeepSeek/Gemini
      # config, which did). See evals/README.md "Runners" table's "an Anthropic model via the Skin"
      # example.
      - run: pnpm vitest run "agents/${{ matrix.agent }}"

      - if: always()
        run: node scripts/ci-report.mjs
        env:
          CI_REPORT_LABEL: eval-agents / ${{ matrix.agent }}
          EVAL_TOKEN_BUDGET: ${{ vars.EVAL_TOKEN_BUDGET_AGENTS || 400000 }}

  # ---------------------------------------------------------------------------------------------
  eval-workflow:
    needs: detect
    if: needs.detect.outputs.run_workflow == 'true'
    # Informational only — see the header comment. A red check here must never block a merge.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: evals
    env:
      EVAL_MODEL: ${{ vars.EVAL_WORKFLOW_MODEL || 'anthropic/claude-haiku-4.5' }}
      EVAL_JUDGE_MODEL: ${{ vars.EVAL_WORKFLOW_MODEL || 'anthropic/claude-haiku-4.5' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Same as eval-agents: an anthropic/* slug needs no LiteLLM proxy.
      - run: pnpm eval:workflow

      # continue-on-error above already keeps this job from blocking a merge, so a budget breach
      # here is a visible warning in the summary, never a gate.
      - if: always()
        run: node scripts/ci-report.mjs
        env:
          CI_REPORT_LABEL: eval-workflow
          EVAL_TOKEN_BUDGET: ${{ vars.EVAL_TOKEN_BUDGET_WORKFLOW || 800000 }}
